<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo ao Planalto — simulador de campanha presidencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e8ec; --surface:#ffffff; --surface2:#f1f2f6; --ink:#1d2430; --muted:#475061; --line:#c9cdd7;
  --green:#138a45; --green-ink:#ffffff; --orange:#d65f12; --yellow:#ffd23f; --yellow-ink:#1d2430;
  --danger:#b83227; --ok:#11743b; --urna:#d8d6cf; --urna-dark:#2a2d33; --screen:#eef3e6; --band:#1d2430; --band-ink:#ffd23f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --surface:#1d2129; --surface2:#262b35; --ink:#eceff4; --muted:#b5bccb; --line:#3a404d;
    --green:#2bb465; --green-ink:#08130c; --orange:#f39152; --yellow:#ffd84f; --yellow-ink:#16181d;
    --danger:#ff7b6b; --ok:#3ccf78; --urna:#3a3c40; --urna-dark:#0f1114; --screen:#1f2a1c; --band:#ffd84f; --band-ink:#16181d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --surface:#1d2129; --surface2:#262b35; --ink:#eceff4; --muted:#b5bccb; --line:#3a404d;
  --green:#2bb465; --green-ink:#08130c; --orange:#f39152; --yellow:#ffd84f; --yellow-ink:#16181d;
  --danger:#ff7b6b; --ok:#3ccf78; --urna:#3a3c40; --urna-dark:#0f1114; --screen:#1f2a1c; --band:#ffd84f; --band-ink:#16181d; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
.top{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font-stretch:125%;font-weight:900;font-size:.95rem}
.linkbtn{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 64px}
h1,h2,h3{font-stretch:112%;line-height:1.1;margin:0 0 .4em}
h1{font-size:clamp(2.2rem,7vw,4.2rem);font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,3.6vw,2rem);font-weight:850}
h3{font-size:1.1rem;font-weight:800}
[tabindex="-1"]:focus{outline:none}
p{margin:.3em 0 .8em;max-width:70ch}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;margin:14px 0}
.panel.quiet{background:transparent;border-style:dashed}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:6px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:var(--line)}
.opt.sel{border-color:var(--green);background:color-mix(in srgb,var(--green) 11%,var(--surface))}
.opt b{display:block;font-weight:750;margin-bottom:2px}
.opt .small{display:block}
.opt:disabled{opacity:.62;cursor:default}
.opt.sel:disabled{opacity:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:5px;padding:12px 20px;font-weight:800;font-stretch:108%;cursor:pointer;background:var(--green);color:var(--green-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--green) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--green) 60%,#000)}
.btn.alt{background:var(--surface2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label.f{display:block;font-weight:700;margin:12px 0 4px}
input.t{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:5px;background:var(--surface2)}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:7px 13px;margin:3px 4px 3px 0;cursor:pointer;font-size:.92rem;font-weight:600}
.chip.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--muted)}
.meter{display:flex;gap:3px}.meter i{width:14px;height:8px;border-radius:2px;background:var(--line)}.meter i.on{background:var(--ink)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--surface2);margin:2px 4px 2px 0}
.tag.up{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.tag.down{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}
.tag.hint{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.warn{border-left:4px solid var(--orange);padding:8px 12px;background:color-mix(in srgb,var(--orange) 9%,var(--surface));margin:8px 0;border-radius:0 5px 5px 0}
.good{border-left:4px solid var(--ok);padding:8px 12px;background:color-mix(in srgb,var(--ok) 9%,var(--surface));margin:8px 0;border-radius:0 5px 5px 0}
.qg{border-left:4px solid var(--ink);padding:10px 14px;background:var(--surface2);margin:10px 0;border-radius:0 5px 5px 0}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.progress>i{display:block;height:100%;background:var(--green);transition:width .3s}
.errc{color:var(--danger);font-weight:600}.okc{color:var(--ok);font-weight:600}
.args{font-size:.92rem;color:color-mix(in srgb,var(--ink) 82%,var(--surface));margin-top:4px;display:block}

.santinho{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--yellow);color:var(--yellow-ink);border-radius:6px;padding:12px 16px;margin:10px 0}
.santinho .num{font-stretch:62%;font-weight:900;font-size:3.4rem;line-height:.9;letter-spacing:-.02em;background:var(--yellow-ink);color:var(--yellow);padding:6px 10px;border-radius:4px;min-width:84px;text-align:center}
.santinho .nm{font-stretch:125%;font-weight:900;font-size:1.25rem;line-height:1.05;text-transform:uppercase}
.santinho .sl{font-style:italic;font-weight:600}
.santinho .pt{font-size:.88rem;font-weight:700;opacity:.85}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.hudg{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(5,minmax(0,1fr));gap:10px;align-items:center}
.minis{display:flex;align-items:center;gap:8px;min-width:0}
.mnum{font-stretch:62%;font-weight:900;font-size:1.6rem;line-height:1;background:var(--yellow);color:var(--yellow-ink);padding:3px 7px;border-radius:3px}
.mnm{font-weight:800;font-stretch:112%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:.78rem;color:var(--muted);line-height:1.2}
.stat b{display:block;color:var(--ink);font-size:1rem}
@media (max-width:620px){.hudg{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}.minis{grid-column:1/-1}}

.poll .ln{display:grid;grid-template-columns:minmax(120px,190px) 1fr 76px;gap:10px;align-items:center;margin:6px 0}
.poll .ln .nm{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poll .ln .val{text-align:right;font-weight:800}
.poll .bar{height:16px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.d{font-size:.78rem;font-weight:700;margin-left:4px}
.d.up{color:var(--ok)}.d.down{color:var(--danger)}
.fx{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.fx:last-child{border-bottom:0}

.axis{margin:12px 0}
.axis .lab{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.axis .track{position:relative;height:26px;background:var(--surface2);border-radius:13px;border:1px solid var(--line)}
.axis .track::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:var(--line)}
.axis .pin{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--surface)}
.axis .pin.me{width:22px;height:22px;background:var(--yellow);border:3px solid var(--yellow-ink);z-index:2}

.event{border:2px solid var(--band);border-radius:6px;background:var(--surface);margin:14px 0;overflow:hidden}
.event .band{background:var(--band);color:var(--band-ink);font-weight:850;font-stretch:118%;padding:7px 16px;font-size:.95rem}
.event .evb{padding:16px 18px 18px}
.news{font-size:.93rem;margin:4px 0;padding-left:14px;position:relative}
.news::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--muted);border-radius:1px}

.qrow{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}.qt{font-weight:700;font-size:.93rem}
@media (max-width:620px){.qrow{grid-template-columns:1fr}}

.urna{background:var(--urna);border-radius:10px;padding:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:16px;max-width:640px;margin:14px auto;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.urna .tela{background:var(--screen);color:#1b2416;border-radius:4px;padding:14px;min-height:180px;font-size:.95rem;border:3px solid var(--urna-dark)}
:root[data-theme="dark"] .urna .tela{color:#dfe9d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .urna .tela{color:#dfe9d6}}
.urna .tela .dig{display:inline-block;width:34px;height:44px;border:2px solid currentColor;margin-right:6px;text-align:center;font-size:2rem;font-weight:800;line-height:40px}
.urna .teclado{background:var(--urna-dark);border-radius:6px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.urna .k{background:#1a1c20;color:#f2f2f2;border-radius:4px;padding:8px 0;font-weight:800;font-size:1.05rem;text-align:center}
.urna .kb{grid-column:span 3;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.urna .kb span{border-radius:4px;padding:6px 2px;text-align:center;font-size:.62rem;font-weight:900}
@media (max-width:620px){.urna{grid-template-columns:1fr}.poll .ln{grid-template-columns:104px 1fr 64px}.santinho .num{font-size:2.6rem;min-width:66px}}
.chart svg{width:100%;height:auto;display:block}
.seglist .ln{display:grid;grid-template-columns:minmax(130px,220px) 1fr 52px;gap:10px;align-items:center;margin:5px 0;font-size:.92rem}
.hero-urna{font-stretch:62%;font-weight:900;font-size:clamp(5rem,20vw,11rem);line-height:.8;letter-spacing:-.03em;color:var(--ink)}
.fade{animation:fd .35s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress>i{transition:none}}
details summary{cursor:pointer;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:680px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(10,12,16,.6)}
.dlg{padding:20px 22px;max-height:82vh;overflow:auto}
.dlg h3{margin-top:16px}
/* capa e cenas */
:root{--sky1:#8fcbef;--sky2:#fbe6c2;--sun:#ffd23f;--lawn:#58a85a;--bldg:#f6f6f1;--glass:#3f5f76}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky1:#0c1a33;--sky2:#2f3f68;--sun:#efe9cf;--lawn:#21462a;--bldg:#d5d9e1;--glass:#1d3046}}
:root[data-theme="dark"]{--sky1:#0c1a33;--sky2:#2f3f68;--sun:#efe9cf;--lawn:#21462a;--bldg:#d5d9e1;--glass:#1d3046}
.cover{position:relative;margin:6px 0 10px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.scene{display:block;width:100%;height:auto}
.cover-t{position:absolute;left:4%;top:5%;max-width:60%}
.cover-t h1{font-size:clamp(2rem,7.4vw,5rem);font-stretch:70%;font-weight:900;letter-spacing:-.01em;line-height:.9;margin:0;color:var(--ink);text-shadow:0 2px 0 color-mix(in srgb,var(--surface) 55%,transparent)}
.kick2{font-weight:800;font-stretch:112%;font-size:clamp(.85rem,2vw,1.15rem);margin:.4em 0 0;color:var(--ink)}
@media (max-width:620px){.cover-t{position:static;max-width:none;padding:12px 14px;background:var(--surface)}}
.fall{animation:fall 10s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{from{transform:translateY(-40px) rotate(0deg)}to{transform:translateY(600px) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){.fall{animation:none;transform:translateY(var(--y)) rotate(20deg)}}
/* bonecos */
.av{display:block}
.sav{background:color-mix(in srgb,var(--yellow-ink) 12%,var(--yellow));border-radius:6px;overflow:hidden;align-self:end;margin:-12px 0 -12px -16px;padding:4px 0 0}
.santinho{grid-template-columns:auto auto 1fr}
.hd{display:inline-flex;width:max-content;border-radius:50%;border:2.5px solid var(--line);background:var(--surface2);overflow:hidden;margin-right:8px;vertical-align:middle;flex-shrink:0}
.hd .av{border-radius:50%}
.hd.big{border-width:3px;margin-right:0}
.poll .ln .nm{display:flex;align-items:center}
.aved{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.avprev{background:linear-gradient(var(--sky1),var(--sky2));border-radius:8px;padding:10px 10px 0;display:flex;justify-content:center;position:sticky;top:12px}
.lbl{display:block;font-weight:700;font-size:.9rem;margin:10px 0 4px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.sel{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:620px){.aved{grid-template-columns:1fr}.avprev{position:static}}
/* impacto */
.g4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.impbox{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.imp{display:inline-flex;align-items:center;gap:8px;margin-right:6px;vertical-align:middle}
.iv{font-weight:900;font-stretch:80%;font-size:1.25rem;min-width:46px}
.iv.up{color:var(--ok)}.iv.down{color:var(--danger)}
.il{font-size:.8rem;color:var(--muted)}
.ib{position:relative;display:inline-block;width:80px;height:8px;border-radius:4px;background:var(--line)}
.ib::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted)}
.ib i{position:absolute;top:0;bottom:0;border-radius:4px}
.ib i.p{background:var(--ok)}.ib i.n{background:var(--danger)}
.it{display:block;margin-top:4px}
.ico{vertical-align:-3px}
.impcard{display:grid;grid-template-columns:auto auto 1fr;gap:14px;align-items:center;border:2px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface)}
.impcard.up{border-color:var(--ok)}.impcard.down{border-color:var(--danger)}
.impcard .hd{margin:0}
.ibig{font-weight:900;font-stretch:65%;font-size:2.6rem;line-height:1}
.ibig.up{color:var(--ok)}.ibig.down{color:var(--danger)}
.ibig small{display:block;font-size:.75rem;font-stretch:100%;color:var(--muted);font-weight:700}
@media (max-width:620px){.impcard{grid-template-columns:auto 1fr}.impcard>div:last-child{grid-column:1/-1}}
.fx2{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.fx2 .it{grid-column:1/-1;margin:0}
.evhead{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.evico{display:flex;width:64px;height:64px;border-radius:12px;background:color-mix(in srgb,var(--orange) 14%,var(--surface));color:var(--orange);align-items:center;justify-content:center}
.event .band{display:flex;align-items:center;gap:8px}
.segi{display:inline-flex;color:var(--green)}
.chance{display:flex;align-items:center;gap:8px;margin-top:8px}.opt .chance .small{display:inline}.opt .chance b{display:inline;margin:0}
.cbar{display:inline-block;width:90px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--ink)}
.bigv{font-size:1.6rem;font-stretch:75%;font-weight:900}
/* debate */
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end;border-radius:10px;padding:18px 16px 0;margin:12px 0;background:radial-gradient(ellipse at 50% 0%,#3b4a73 0%,#141a2b 70%);color:#fff;overflow:hidden}
.pod{display:flex;flex-direction:column;align-items:center;position:relative}
.podium{width:120px;background:#2a3350;border-top:6px solid;text-align:center;font-weight:900;font-stretch:65%;font-size:1.6rem;padding:4px 0 10px;margin-top:-18px;position:relative;z-index:1}
.pn{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.72rem;font-weight:700;z-index:2;opacity:.85}
.bubble{align-self:center;background:#fff;color:#1d2430;border-radius:12px;padding:12px 14px;font-weight:600;font-size:.92rem;position:relative;margin-bottom:40px}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;border:10px solid transparent;border-right-color:#fff;border-left:0;transform:translateY(-50%)}
@media (max-width:620px){.stage{grid-template-columns:1fr 1fr}.bubble{grid-column:1/-1;grid-row:1;margin-bottom:6px}.bubble::before{display:none}.podium{width:100px}}
</style>
</head>
<body>
<header class="top"><span class="brand">Rumo ao Planalto</span><button type="button" class="linkbtn" onclick="openHelp()">Como funciona</button></header>
<main class="wrap" id="app"></main>
<div id="live" class="sr" aria-live="polite"></div>
<dialog id="help" aria-labelledby="helpT"><div class="dlg" id="helpBody"></div></dialog>
<script>
// ===== ENGINE START =====
const AX=['eco','soc','seg','amb','inst'];
const AXL={
  eco:['Mais Estado','Mais mercado','Economia'],
  soc:['Progressista','Conservador','Costumes'],
  seg:['Prevenção social','Linha-dura','Segurança'],
  amb:['Produção primeiro','Preservação primeiro','Meio ambiente'],
  inst:['Institucional','Antissistema','Sistema político']
};
const SEGS=[
 {id:'evang',n:'Evangélicos e religiosos conservadores',s:'Evangélicos',sh:.16,ideal:{eco:.3,soc:1.8,seg:1.3,amb:-.2,inst:.6},sal:{eco:.3,soc:1,seg:.5,amb:.1,inst:.3}},
 {id:'ne',n:'Nordeste popular e beneficiários de programas sociais',s:'Nordeste popular',sh:.18,ideal:{eco:-1.6,soc:.6,seg:.2,amb:0,inst:-.4},sal:{eco:1,soc:.25,seg:.2,amb:.1,inst:.25}},
 {id:'agro',n:'Agronegócio e interior',s:'Agro e interior',sh:.10,ideal:{eco:1.2,soc:1.2,seg:1.6,amb:-1.6,inst:.6},sal:{eco:.5,soc:.4,seg:.5,amb:.8,inst:.3}},
 {id:'cm',n:'Classe média urbana',s:'Classe média',sh:.14,ideal:{eco:.8,soc:.1,seg:.8,amb:.5,inst:.2},sal:{eco:.5,soc:.3,seg:.4,amb:.2,inst:.5}},

const K=1.3,NULU=-1.7;
function dist(pos,s){let d=0;for(const a of AX)d+=s.sal[a]*Math.abs((pos[a]||0)-s.ideal[a]);return d;}
function util(c,s){return -0.8*dist(c.pos,s)+c.ap+(c.sb[s.id]||0)+(c.fame||0)-(c.rej||0)*0.012;}
function shares(cands){
  const tot={},bySeg={};cands.forEach(c=>tot[c.id]=0);let nul=0;
  for(const s of SEGS){
    const us=cands.map(c=>Math.exp(K*util(c,s)));const un=Math.exp(K*NULU);const T=us.reduce((a,b)=>a+b,0)+un;
    bySeg[s.id]={};cands.forEach((c,i)=>{const p=us[i]/T;tot[c.id]+=s.sh*p;bySeg[s.id][c.id]=p*T/(T-un);});nul+=s.sh*un/T;
  }
  const valid={};cands.forEach(c=>valid[c.id]=tot[c.id]/(1-nul)*100);
  return {valid,nul:nul*100,bySeg};
}
function rejOf(c){let r=0;for(const s of SEGS){r+=s.sh/(1+Math.exp(-(dist(c.pos,s)-2.7)*1.7));}return Math.max(2,Math.min(80,r*70+(c.rej||0)));}
function axDist(a,b){let d=0;for(const x of AX)d+=Math.abs((a[x]||0)-(b[x]||0));return d;}

// ===== POSIÇÃO E COERÊNCIA =====
function computePos(){
  const acc={},n={};AX.forEach(a=>{acc[a]=0;n[a]=0;});
  for(const th of THEMES){const i=S.p.ans[th.id];if(i==null)continue;const v=th.o[i].v;for(const a in v){acc[a]+=v[a];n[a]++;}}
  AX.forEach(a=>S.p.pos[a]=n[a]?acc[a]/n[a]:0);
}
function ideo(pos){return (pos.eco+pos.soc+pos.seg)/3;}
function finalizeSetup(){
  const p=S.p;computePos();p.sb={};p.warn=[];p.ap=0;
  const party=PARTIES[p.party],vice=VICES[p.vice],mk=MKTS[p.mkt];
  addSb(party.sb);addSb(vice.sb);addSb(mk.sb);
  let cost=0;
  for(const th of THEMES){const o=th.o[p.ans[th.id]];if(o.sb)addSb(o.sb);cost+=o.cost||0;}
  for(const k of p.prios){addSb(PRIOS[k].sb);cost+=PRIOS[k].cost;}
  p.cost=cost;
  p.money=party.fundo+(vice.money||0);
  p.tv=party.tv+(vice.tv||0);
  p.bag=party.bag+(vice.bag||0);
  p.fame=-.55+(vice.fame||0)+(isEasyNum(p.num)?.04:0);
  let coh=0;const id=ideo(p.pos);
  const dParty=Math.abs(id-party.ideo);
  if(!party.flex&&dParty>.5){coh+=.14*(dParty-.5);p.warn.push(`Suas posições (${ideoName(id)}) não combinam com a história do ${party.sig}. Militância desconfiada e menos engajamento.`);}
  const dLab=Math.abs(id-LABELS[p.label].v);
  if(dLab>.6){coh+=.15*(dLab-.6);p.warn.push(`Você se declara ${LABELS[p.label].n.toLowerCase()}, mas suas propostas apontam para ${ideoName(id).toLowerCase()}. Adversários vão explorar essa contradição.`);}
  if(p.pos.eco>.6&&cost>=3){coh+=.08;p.warn.push('Você defende uma economia liberal, mas promete gastos altos. O discurso não fecha.');}
  if(p.pos.eco<-.6&&p.prios.includes('fiscal')){coh+=.04;p.warn.push('Ajuste fiscal como prioridade num programa estatista soa como contradição para sua própria base.');}
  if(p.pos.soc<-.6&&p.prios.includes('familia')){coh+=.03;p.warn.push('“Valores da família” como bandeira, com posições progressistas nos costumes, pode soar oportunista.');}
  if(cost>=5){addSb({merc:-.35,cm:-.1});p.flags.irreal=true;p.warn.push(`Seu programa tem custo fiscal alto (${cost} pontos). O mercado reage mal e os debates vão perguntar de onde sai o dinheiro.`);}
  else if(cost<=0){addSb({merc:.12,ne:-.05});}
  const mid=THEMES.filter(th=>p.ans[th.id]===1).length;
  if(mid>=9){coh+=.045*(mid-8);p.warn.push(`Você ficou no meio-termo em ${mid} dos ${THEMES.length} temas. Moderação reduz rejeição, mas o eleitor não sabe o que você defende e ninguém se empolga com a sua campanha.`);}
  // extremos aumentam rejeição
  const ext=AX.reduce((a,x)=>a+Math.max(0,Math.abs(p.pos[x])-1.4),0);
  p.rej=ext*4;
  if(ext>.8)p.warn.push('Seu perfil tem posições extremas em vários temas. Isso empolga a base, mas aumenta a rejeição.');
  p.coh=coh;
  S.deck=buildDeck();
}
function ideoName(v){if(v<-1)return 'Esquerda';if(v<-.35)return 'Centro-esquerda';if(v<=.35)return 'Centro';if(v<=1)return 'Centro-direita';return 'Direita';}
function isEasyNum(n){return n.length===2&&(n[0]===n[1]||n[1]==='0');}

function buildDeck(){return EVENTS.map(e=>e.id);}
function drawEvent(){
  const pool=EVENTS.filter(e=>!S.usedEv.includes(e.id));
  const ws=pool.map(e=>e.w?e.w(S):1);const tot=ws.reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){S.usedEv.push(pool[i].id);return pool[i];}}
  const e=pool[0];S.usedEv.push(e.id);return e;
}
function applyFx(f){
  if(typeof f==='function')f=f(S);
  const p=S.p;
  if(f.ap)p.ap+=f.ap;if(f.sb)addSb(f.sb);if(f.rej)p.rej+=f.rej*(MKTS[p.mkt].rejm||1)*.8;
  if(f.money)p.money=Math.max(0,p.money+f.money);if(f.fame)p.fame+=f.fame;if(f.bag)p.bag+=f.bag;
  if(f.flag)p.flags[f.flag]=true;
  if(f.cost){p.cost+=f.cost;if(p.cost>=5&&!p.flags.irreal){p.flags.irreal=true;addSb({merc:-.2});}}
}

function numHint(){const n=S.p.num,e=$('numhint');if(!e)return;let m='',c='errc';

function validCand(){
  const p=S.p;const e=[];
  if(p.nome.trim().length<2)e.push('Escreva um nome de urna.');

  if(e.length){const x=$('err');x.style.display='block';x.innerHTML=e.join('<br>');x.scrollIntoView({block:'center'});return;}
  go('chapa');
}

function sbTags(sb){return Object.entries(sb).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag ${v>0?'up':'down'}">${v>0?'+':'−'} ${SEG[k].s}</span>`).join('');}

// ----- temas (completo) -----
function segScores(th,i){
  const o=th.o[i];
  return SEGS.map(s=>{let sc=0;for(const a in o.v){const mid=th.o[1].v[a]||0;sc+=s.sal[a]*(Math.abs(mid-s.ideal[a])-Math.abs(o.v[a]-s.ideal[a]));}sc+=(o.sb&&o.sb[s.id]||0)*3;return [s,sc];});
}
function reaction(th,i){
  const r=segScores(th,i).filter(([,sc])=>Math.abs(sc)>.35).sort((a,b)=>b[1]-a[1]);
  return r.map(([s,sc])=>`<span class="tag ${sc>0?'up':'down'}">${sc>0?'aprovam':'rejeitam'}${Math.abs(sc)>1?' fortemente':''}: ${s.s}</span>`).join('')||'<span class="tag">reação morna em todos os grupos</span>';
}
function provisional(ans,extra){
  const acc={},n={};AX.forEach(a=>{acc[a]=0;n[a]=0;});const sb={};let cost=0;
  THEMES.forEach(t=>{const idx=ans[t.id]!=null?ans[t.id]:1;const o=t.o[idx];for(const a in o.v){acc[a]+=o.v[a];n[a]++;}if(ans[t.id]!=null&&o.sb)for(const k in o.sb)sb[k]=(sb[k]||0)+o.sb[k];});
  if(extra)for(const k in extra)sb[k]=(sb[k]||0)+extra[k];
  const pos={};AX.forEach(a=>pos[a]=n[a]?acc[a]/n[a]:0);
  const ext=AX.reduce((x,a)=>x+Math.max(0,Math.abs(pos[a])-1.4),0);
  const c={id:'eu',pos,ap:.18,sb,fame:-.25,rej:ext*4};
  const r=shares([c,...OPPS.map(o=>({...o,fame:0}))]);return {v:r.valid.eu,rej:rejOf(c),bySeg:r.bySeg,pos};
}
function themePv(th,i){const a1={...S.p.ans,[th.id]:i},a0={...S.p.ans,[th.id]:1};const x=provisional(a1),y=provisional(a0);return {d:x.v-y.v,rej:x.rej-y.rej};}

  </div>
  <div class="row" style="margin-top:16px"><button class="btn alt" onclick="if(S.quick)go('perfil');else{S.qi=THEMES.length-1;go('temas')}">Voltar</button><button class="btn" ${p.prios.length!==3?'disabled':''} onclick="finalizeSetup();S.hist=[poll(active(),.6)];go('diag')">Ver diagnóstico do QG</button></div>`,keep);
};
function togPrio(k){const a=S.p.prios;const i=a.indexOf(k);if(i>=0)a.splice(i,1);else if(a.length<3)a.push(k);redraw();}

// ----- diagnóstico -----
function axisChart(){
  return AX.map(a=>{
    const pins=S.opps.map(o=>`<span class="pin" style="left:${(o.pos[a]+2)/4*100}%;background:${o.cor}"></span>`).join('');
    const desc=`${AXL[a][2]}: você em ${fmt(S.p.pos[a])}; `+S.opps.map(o=>`${o.nome} em ${fmt(o.pos[a])}`).join('; ')+'. Escala de −2 ('+AXL[a][0]+') a +2 ('+AXL[a][1]+').';
    return `<div class="axis" role="img" aria-label="${desc}"><div class="lab" aria-hidden="true"><span>${AXL[a][0]}</span><b style="color:var(--ink)">${AXL[a][2]}</b><span>${AXL[a][1]}</span></div><div class="track" aria-hidden="true">${pins}<span class="pin me" style="left:${(S.p.pos[a]+2)/4*100}%"></span></div></div>`;
  }).join('')+`<div class="small" style="margin-top:6px" aria-hidden="true"><span class="dot" style="background:var(--yellow);border:2px solid var(--yellow-ink)"></span>Você ${S.opps.map(o=>`<span style="margin-left:10px;white-space:nowrap"><span class="dot" style="background:${o.cor}"></span>${o.nome}</span>`).join('')}</div>`;
}
function pollBlock(pl,prev,title){
  const ids=ranking(pl.v);
  return `<div class="poll"><h3>${title}</h3>${ids.map(id=>{const d=prev&&prev.v[id]!=null?pl.v[id]-prev.v[id]:0;
    return `<div class="ln"><span class="nm"><span class="hd" style="border-color:${colorOf(id)}">${headOf(id,30)}</span>${esc(nameOf(id))}</span><div class="bar" aria-hidden="true"><i style="width:${pl.v[id]}%;background:${colorOf(id)}"></i></div><span class="val">${fmt(pl.v[id])}%${prev&&Math.abs(d)>=.3?`<span class="d ${d>0?'up':'down'}"><span aria-hidden="true">${d>0?'▲':'▼'}</span><span class="sr">${d>0?'subiu':'caiu'}</span>${fmt(Math.abs(d))}</span>`:''}</span></div>`;}).join('')}
    <p class="small muted">Votos válidos. Brancos, nulos e indecisos: ${fmt(pl.nul)}% do eleitorado. Margem de erro: 2 pontos.</p></div>`;
}
SCR.diag=function(keep){
  const pl=S.hist[0];const id=ideo(S.p.pos);

  <div class="panel">${pollBlock(pl,null,'Primeira pesquisa, antes da campanha')}

  <div class="panel"><h3>Seus eleitores em potencial</h3><div class="seglist">${segs.map(([s,v])=>`<div class="ln"><span>${ico(s.id)} ${s.s}</span><div class="bar" aria-hidden="true"><i style="width:${v*100}%;background:var(--ink)"></i></div><span>${Math.round(v*100)}%</span></div>`).join('')}</div>
  <p class="small muted">Sua fatia dos votos válidos em cada grupo do eleitorado.</p></div>
  <div class="panel"><h3>Alertas do marqueteiro</h3>${S.p.warn.length?S.p.warn.map(w=>`<div class="warn">${w}</div>`).join(''):'<div class="good">Campanha coerente: posições, partido e discurso estão alinhados.</div>'}</div>
  <button class="btn" onclick="S.review=false;go('estrat')">Definir estratégia contra cada adversário</button>`,keep);
};
// ----- estratégia -----
const STRATS={atacar:'Atacar duramente',contrastar:'Contrastar propostas',ignorar:'Ignorar',acenar:'Acenar para o eleitorado'};
function overlap(o){const D=axDist(S.p.pos,o.pos);return D<3.2?'alta':D<6?'média':'baixa';}
function strongSegs(o,pl){return SEGS.map(s=>[s,pl.bySeg[s.id][o.id]||0]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0].s.toLowerCase()).join(' e ');}
function questiona(o,st){
  const pl=S.hist[S.hist.length-1];const lead=ranking(pl.v)[0]===o.id;const ov=overlap(o);const n=o.nome;const ele=o.g==='a'?'ela':'ele';
  if(st==='atacar')return (ov==='alta'?`Vocês disputam o mesmo eleitor. Bater em ${n} pode trazer votos para você, mas eleitor não gosta de briga entre parecidos e sua rejeição sobe. Você tem argumento além do ataque?`
    :`${n} fala com um eleitorado bem diferente do seu. Atacar consolida sua base e vira manchete, mas radicaliza a campanha e fecha portas para um 2º turno. É essa a eleição que você quer disputar?`)
    +(lead?` Como ${ele} lidera, se ninguém bater, ${ele} cresce.`:'')+(MKTS[S.p.mkt].atk>1.3?' Seu marqueteiro adora isso; cuidado com a rejeição.':'');
  if(st==='contrastar')return `Comparar propostas é mais elegante, combina com debates e não espanta indecisos. Rende pouco em manchete e só funciona se o seu plano parar em pé: ${S.p.coh>.08?'o QG vê contradições no seu programa.':'o seu está consistente.'}`;
  if(st==='ignorar')return lead?`Ignorar quem lidera as pesquisas é arriscado: ${n} segue crescendo sem contraponto. Você confia que ${ele} vai cair sozinh${o.g}?`:`Ignorar economiza energia e evita dar palco a ${n}. Mas, se crescer no seu eleitorado, você vai reagir tarde?`;
  return axDist(S.p.pos,o.pos)<5.5?`Acenar para os eleitores de ${n} prepara uma aliança no 2º turno e amplia seu alcance. O risco é parecer que você não tem posição própria.`:`Vocês estão em polos opostos. Acenar para o eleitorado de ${n} pode soar oportunista e irritar sua própria base. Vale o risco?`;
}
SCR.estrat=function(keep){
  const pl=S.hist[S.hist.length-1];
  const all=S.opps.every(o=>S.stratOk[o.id]);const nOk=S.opps.filter(o=>S.stratOk[o.id]).length;
  render(`
  <h2>${S.review?'Revisão de estratégia na metade da campanha':'Estratégia contra os adversários'}</h2>
  <p class="muted">${S.review?'As pesquisas mudaram. Confirme ou ajuste o tratamento a cada adversário.':'Escolha como lidar com cada um. O QG vai questionar cada escolha antes de você confirmar.'} ${nOk} de ${S.opps.length} definidas.</p>
  ${S.opps.map(o=>{const st=S.strat[o.id];const ok=S.stratOk[o.id];return `<section class="panel" aria-labelledby="op-${o.id}">
    <div class="row between"><h3 style="margin:0;display:flex;align-items:center;gap:10px" id="op-${o.id}"><span class="hd big" style="border-color:${o.cor}">${headOf(o.id,52)}</span>${o.nome} <span class="muted" style="font-weight:600">${o.num}, ${o.sig}</span></h3><span><b>${fmt(pl.v[o.id])}%</b> <span class="muted small">rejeição ${fmt(pl.rej[o.id])}%</span></span></div>
    <p class="small" style="margin-top:6px"><i>“${o.slogan}”</i>. ${o.arq}.</p>
    <p class="small muted">${o.bio}</p>
    <p class="small">Forte entre ${strongSegs(o,pl)}. Disputa de eleitorado com você: <b>${overlap(o)}</b>.</p>
    <div class="grid g4" role="group" aria-label="Estratégia contra ${o.nome}">${Object.entries(STRATS).map(([k,n])=>{const pv=preview(()=>applyStrat(o,k,pl,ranking(pl.v)));return `<button class="opt ${st===k?'sel':''}" aria-pressed="${st===k}" data-k="st-${o.id}-${k}" onclick="S.strat['${o.id}']='${k}';delete S.stratOk['${o.id}'];redraw()"><b>${n}</b><span class="impbox">${impLine(pv,'votos por semana')}${k==='atacar'?'<span class="tag hint">provoca contra-ataques</span>':''}${k==='acenar'?'<span class="tag hint">facilita aliança no 2º turno</span>':''}</span></button>`;}).join('')}</div>
    ${st?`<div class="qg" aria-live="polite"><b>O QG questiona</b><br>${questiona(o,st)}
      ${ok?`<div class="good small" style="margin:10px 0 0">Estratégia definida: ${low(STRATS[st])}. Para mudar, escolha outra opção acima.</div>`
         :`<div class="row" style="margin-top:10px"><button class="btn" data-k="ok-${o.id}" onclick="S.stratOk['${o.id}']=true;redraw()">Manter estratégia</button><button class="btn alt" data-k="re-${o.id}" onclick="delete S.strat['${o.id}'];redraw()">Reconsiderar</button></div>`}</div>`:''}
  </section>`;}).join('')}
  <button class="btn" ${all?'':'disabled'} onclick="confirmStrat()">${S.review?'Seguir com a campanha':'Começar a campanha'}</button>
  ${all?'':'<p class="small muted">Confirme a estratégia para cada adversário para continuar.</p>'}`,keep);
};
function confirmStrat(){
  if(!S.review){S.week=1;S.news=['Começa oficialmente a campanha. Os santinhos já estão nas ruas.'];S.ev=drawEvent();S.evPick=null;S.evChoice=null;S.agenda=null;S.intens=0;S.fx=[];S.lastFx=[];}
  go('semana');
}

// ----- semana -----
function fameLbl(){const f=S.p.fame;return f<-.4?'Baixa':f<-.15?'Média':f<.05?'Alta':'Muito alta';}
function hud(){
  const pl=S.hist[S.hist.length-1];const rk=ranking(pl.v).indexOf('eu')+1;
  return `<div class="hud" role="region" aria-label="Painel da campanha"><div class="hudg">
    <span class="minis"><span class="hd" style="border-color:var(--yellow-ink)">${headOf('eu',38)}</span><span class="mnum">${esc(S.p.num)}</span><span class="mnm">${esc(S.p.nome)}</span></span>
    <span class="stat">Semana<b>${S.week} de 6</b></span>
    <span class="stat">Posição<b>${rk}º, ${fmt(pl.v.eu)}%</b></span>
    <span class="stat">Rejeição<b>${fmt(pl.rej.eu)}%</b></span>
    <span class="stat">Recursos<b>${S.p.money}</b></span>
    <span class="stat">Visibilidade<b>${fameLbl()}</b></span>
  </div></div>`;
}
function historyChart(){
  const H=S.hist;if(H.length<2)return '';
  const ids=['eu',...S.opps.filter(o=>!o.out).map(o=>o.id)];
  const W=640,Ht=210,pl=30,pr=128,pt=12,pb=26;const mx=Math.max(40,...H.flatMap(h=>ids.map(i=>h.v[i]||0)))+5;
  const x=i=>pl+i*(W-pl-pr)/(H.length-1);const y=v=>Ht-pb-v/mx*(Ht-pt-pb);
  let g='';for(let t=0;t<=mx;t+=10)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="4" y="${y(t)+4}" font-size="11" fill="var(--muted)">${t}%</text>`;
  const lines=ids.map(id=>{const pts=H.map((h,i)=>`${x(i)},${y(h.v[id]||0)}`).join(' ');
    return id==='eu'?`<polyline points="${pts}" fill="none" stroke="var(--yellow-ink)" stroke-width="6" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="var(--yellow)" stroke-width="3" stroke-linejoin="round"/>`
      :`<polyline points="${pts}" fill="none" stroke="${colorOf(id)}" stroke-width="2.5" stroke-dasharray="${DASH[id]}" stroke-linejoin="round"/>`;}).join('');
  const ends=ids.map(id=>({id,y:y(H[H.length-1].v[id]||0)})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
  const labels=ends.map(e=>`<text x="${W-pr+8}" y="${e.y+4}" font-size="11.5" font-weight="700" fill="var(--ink)">${esc(shortOf(e.id))} ${fmt(H[H.length-1].v[e.id])}%</text>`).join('');
  const xl=H.map((h,i)=>`<text x="${x(i)}" y="${Ht-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${i===0?'início':'S'+i}</text>`).join('');
  const desc='Evolução das pesquisas. '+ids.map(id=>`${nameOf(id)}: `+H.map(h=>fmt(h.v[id]||0)).join(', ')).join('. ');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${esc(desc)}">${g}${lines}${labels}${xl}</svg></div>`;
}
function fxPanel(){
  if(!S.lastFx||!S.lastFx.length||S.hist.length<2)return '';
  const H=S.hist;const tot=H[H.length-1].v.eu-H[H.length-2].v.eu;const sum=S.lastFx.reduce((a,f)=>a+f.d,0);
  const cls=d=>d>.05?'up':d<-.05?'down':'';
  return `<div class="panel"><h3>O que mudou na sua intenção de voto</h3><p class="small muted">Efeito estimado de cada fator na semana passada, em pontos dos votos válidos.</p>
  ${S.lastFx.map(f=>`<div class="fx2"><span class="fl">${esc(f.l)}</span><span class="imp"><span class="iv ${cls(f.d)}">${sgnF(f.d)}</span>${impBar(f.d)}</span><span class="it">${f.seg?impTags(f,2):''}</span></div>`).join('')}
  <div class="fx"><span class="muted">Oscilação da pesquisa, dentro da margem de erro</span><span class="tag">${fdel(tot-sum)}</span></div>
  <div class="fx"><span><b>Variação total na pesquisa</b></span><span class="tag ${cls(tot)}">${fdel(tot)}</span></div></div>`;
}
function eventCard(){
  const e=S.ev;const done=S.evChoice!=null;const cur=done?S.evChoice:S.evPick;
  return `<section class="event" aria-labelledby="evT"><div class="band">${ico(EVICO[e.k]||'siren',20)} Plantão da campanha: ${low(e.k)}</div><div class="evb">
    <div class="evhead"><span class="evico" aria-hidden="true">${ico(EVICO[e.k]||'siren',44)}</span><div><h3 id="evT" style="font-size:1.3rem">${e.t}</h3><p class="muted" style="margin-bottom:0">${e.x}</p></div></div>
    <p class="small muted" style="margin-top:12px">Impacto estimado pelo QG antes de você decidir:</p>
    <div class="grid" role="group" aria-label="Como você reage">${e.o.map((o,i)=>{const pv=done?null:preview(()=>applyFx(o.f));return `<button class="opt ${cur===i?'sel':''}" aria-pressed="${cur===i}" data-k="ev${i}" ${done?'disabled':''} onclick="S.evPick=${i};redraw()"><b>${o.t}</b>${pv?`<span class="impbox">${impLine(pv)}</span>`:''}</button>`;}).join('')}</div>
    ${!done&&S.evPick!=null?`<div class="row" style="margin-top:12px"><button class="btn" data-k="evok" onclick="confirmEv()">Confirmar decisão</button><span class="small muted">Depois de confirmar, não dá para voltar atrás.</span></div>`:''}
    <div aria-live="polite">${done?`<div class="qg">${e.o[S.evChoice].m}</div>${impCard(S.evImp,'Efeito da sua decisão')}`:''}</div>
  </div></section>`;
}
function confirmEv(){
  if(S.evChoice!=null||S.evPick==null)return;const e=S.ev,i=S.evPick;S.evChoice=i;
  S.evImp=track(`Resposta à crise: ${low(e.o[i].t)}`,()=>applyFx(e.o[i].f));
  S.log.push(`${S.phase==='evento2'?'2º turno':'Semana '+S.week}: ${low(e.t)}. Você decidiu: ${low(e.o[i].t)}.`);
  redraw();focusEl(S.phase==='evento2'?'next2':'agT');
}
function affLbl(id){const d=dist(S.p.pos,SEG[id]);return d<1.6?'alta':d<2.8?'média':'baixa';}
SCR.semana=function(keep){
  const pl=S.hist[S.hist.length-1];const prev=S.hist.length>1?S.hist[S.hist.length-2]:null;
  const debNext=(S.week===2&&S.p.deb==='todos')||(S.week===5&&S.p.deb!=='nenhum');
  const done=S.evChoice!=null;
  render(`${hud()}
  <h2 class="sr">Semana ${S.week} de campanha</h2>
  ${fxPanel()}
  <div class="panel">${pollBlock(pl,prev,S.week===1?'Pesquisa de largada':'Pesquisa da semana')}${historyChart()}</div>
  ${S.news.length?`<div class="panel quiet"><h3>Nos bastidores</h3>${S.news.map(n=>`<div class="news">${n}</div>`).join('')}</div>`:''}
  <p class="small muted" style="margin-top:18px"><b>Passo 1 de 2:</b> responda à crise da semana.</p>
  ${eventCard()}
  ${done?`<p class="small muted" style="margin-top:18px"><b>Passo 2 de 2:</b> defina a agenda.</p>
  <div class="panel">
    <h3 id="agT">Agenda da semana</h3>
    <p class="small muted">Onde você vai fazer campanha? A agenda rende mais onde suas propostas já têm afinidade.</p>
    <div class="grid g3">${AGENDAS.map(a=>{const pv=preview(()=>applyAgenda(a.id,S.intens));return `<button class="opt ${S.agenda===a.id?'sel':''}" aria-pressed="${S.agenda===a.id}" data-k="ag-${a.id}" onclick="S.agenda='${a.id}';redraw()"><b><span class="segi">${ico(a.id,20)}</span> ${a.n}</b><span class="small muted">Afinidade ${affLbl(a.id)}. Você tem ${Math.round(pl.bySeg[a.id].eu*100)}% ali.</span><span class="impbox">${impLine(pv)}</span></button>`;}).join('')}</div>
    <h3 style="margin-top:14px">Intensidade</h3>
    <p class="small muted">Você tem ${S.p.money} ${S.p.money===1?'ponto':'pontos'} de recurso para o resto da campanha.</p>
    <div class="grid g3">${INTENS.map((t,i)=>`<button class="opt ${S.intens===i?'sel':''}" aria-pressed="${S.intens===i}" data-k="in-${i}" ${t.c>S.p.money?'disabled':''} onclick="S.intens=${i};redraw()"><b>${t.n}</b><span class="small muted">${t.c>S.p.money?'Recursos insuficientes':t.d}</span>${S.agenda&&t.c<=S.p.money?`<span class="impbox">${impLine(preview(()=>applyAgenda(S.agenda,i)))}</span>`:''}</button>`).join('')}</div>
  </div>
  <button class="btn" ${!S.agenda?'disabled':''} onclick="endWeek()">${S.week<6?(debNext?'Encerrar semana e ir ao debate':'Encerrar a semana'):'Ir para o dia da eleição'}</button>
  ${!S.agenda?'<p class="small muted">Escolha uma agenda para encerrar a semana.</p>':''}`:''}`,keep);
};

function applyAgenda(id,ii){
  const p=S.p,mk=MKTS[p.mkt],it=INTENS[ii];
  p.money-=it.c;const aff=cl(1.15-dist(p.pos,SEG[id])/4,.25,1);
  addSb({[id]:.055*it.m*aff});
  p.fame+=.035*it.m+p.tv*.006+(mk.digital?.015:0);
  if(PARTIES[p.party].sig==='RPS')addSb({jov:.01});
}
function applyStrat(o,st,pl,rk){
  const p=S.p,mk=MKTS[p.mkt],D=axDist(p.pos,o.pos);
  if(st==='atacar'){o.ap-=.05*mk.atk;p.rej+=.7*mk.rejm;
    if(D<3.2)p.ap+=.025;else{for(const s of SEGS){const ds=dist(o.pos,s);addSb({[s.id]:ds>2.5?.012:-.012});}}
    o.angry=(o.angry||0)+1;}
  else if(st==='contrastar'){o.ap-=.02*(p.mkt==='tec'?1.4:1);p.ap+=p.coh>.08?0:.012;}
  else if(st==='ignorar'){if(rk[0]===o.id)o.ap+=.025;else p.ap+=.006;}
  else if(st==='acenar'){const top=SEGS.map(s=>[s.id,pl.bySeg[s.id][o.id]]).sort((a,b)=>b[1]-a[1]).slice(0,2);
    if(D<5.5){top.forEach(([sid])=>addSb({[sid]:.025}));o.friend=(o.friend||0)+1;}else{p.ap-=.02;}}
}
function weekDynamics(){
  const p=S.p;const news=[];
  const it=INTENS[S.intens];const ag=AGENDAS.find(a=>a.id===S.agenda);
  track(`Agenda: ${low(ag.n)}, intensidade ${low(it.n)}`,()=>applyAgenda(S.agenda,S.intens));
  const pl=S.hist[S.hist.length-1];const rk=ranking(pl.v);
  for(const o of S.opps){if(o.out)continue;const st=S.strat[o.id];
    track(`Estratégia contra ${o.nome}: ${low(STRATS[st])}`,()=>applyStrat(o,st,pl,rk));
    if(st==='atacar')news.push(`Sua campanha bateu forte em ${o.nome}.`);
  }
  track('Campanha e ataques dos adversários',()=>{
    for(const o of S.opps){if(o.out)continue;o.ap+=rnd(-.035,.045);
      const base=OPPS.find(x=>x.id===o.id).sb;for(const k in base)o.sb[k]+=.025;
      const myRk=rk.indexOf(o.id);
      let target=o.angry&&Math.random()<.65?'eu':(myRk===0?rk[1]:rk[0]);
      if(o.friend&&target==='eu'&&Math.random()<.6)target=myRk===0?rk[1]:rk[0];
      if(target==='eu'){p.ap-=.025+(o.angry?.015:0);news.push(`${o.nome} usou o horário eleitoral para atacar você.`);}

const DEBR={

function oppAnswer(o,th){const a=Object.keys(th.o[0].v)[0];let best=0,bd=99;th.o.forEach((op,i)=>{const d=Math.abs(op.v[a]-o.pos[a]);if(d<bd){bd=d;best=i;}});return best;}
function hurtSeg(th,i){const o=th.o[i];let best=null,bs=-1;for(const s of SEGS){let sc=0;for(const a in o.v)sc+=s.sal[a]*Math.abs(o.v[a]-s.ideal[a])*s.sh;if(sc>bs){bs=sc;best=s;}}return best;}

  const o=th.o[i];let best=SEGS[0],bd=99;for(const s of SEGS){let d=0;for(const a in o.v)d+=Math.abs(o.v[a]-s.ideal[a]);if(d<bd){bd=d;best=s;}}return best;}

    used.add(best.id);qs.push({o,th:best,tpl:Math.floor(Math.random()*4)});
  }
  if(S.p.flags.irreal)qs[qs.length-1].fiscal=true;
  S.deb={second,qs,i:0,res:[],score:0,start:myShare()};
  go('debate');
}
function pergunta(q){
  const tr=cap(S.p.g==='a'?'candidata':'candidato');const th=q.th;const mi=S.p.ans[th.id];const hs=hurtSeg(th,mi);const os=th.o[oppAnswer(q.o,th)].s;const ms=th.o[mi].s;
  if(q.fiscal)return `${tr}, seu programa custa uma fortuna. De onde vai sair o dinheiro? Vai aumentar imposto ou deixar a inflação voltar?`;
  if(mi===oppAnswer(q.o,th))return `${tr}, nós dois defendemos ${ms}. Mas por que o eleitor acreditaria em você, que nunca colocou isso em prática?`;
  return [`${tr}, você defende ${ms}. Como vai explicar isso para ${low(hs.n)}?`,
    `Eu defendo ${os}; você defende ${ms}. O eleitor merece saber: por que a sua ideia é melhor do que a minha?`,

}
function hints(k,q){

function debProb(k,q){

function apuracao(result,ids,el,onDone){

  function frame(){

    const cur={};let tot=0;ids.forEach(id=>{cur[id]=Math.max(.1,result[id]+bias[id]*(1-t));tot+=cur[id];});ids.forEach(id=>cur[id]=cur[id]/tot*100);

    el.innerHTML=`<p class="small"><b>${fmt(pct)}% das seções totalizadas</b></p><div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="poll">${rk.map(id=>`<div class="ln"><span class="nm"><span class="hd" style="border-color:${colorOf(id)}">${headOf(id,30,t<1?'neutral':(id===rk[0]?'happy':'sad'))}</span>${esc(nameOf(id))}</span><div class="bar" aria-hidden="true"><i style="width:${cur[id]}%;background:${colorOf(id)}"></i></div><span class="val">${fmt(cur[id])}%</span></div>`).join('')}</div>`;

function majorityOption(th){let best=0,bs=-1e9;th.o.forEach((o,i)=>{let sc=0;for(const s of SEGS){for(const a in o.v)sc-=s.sh*s.sal[a]*Math.abs(o.v[a]-s.ideal[a]);}if(sc>bs){bs=sc;best=i;}});return best;}

  const f=S.final;const p=S.p;const lastSeg=(S.r2||S.r1).bySeg;
  const match=THEMES.filter(th=>majorityOption(th)===p.ans[th.id]).length;
  const affin=S.opps.map(o=>[o,cl(100-axDist(p.pos,o.pos)*9,0,100)]).sort((a,b)=>b[1]-a[1]);
  const segs=SEGS.map(s=>[s,lastSeg[s.id].eu||0]).sort((a,b)=>b[1]-a[1]);
  const best=segs[0][0],worst=segs[segs.length-1][0];
  const fat=[];
  fat.push(p.coh>.08?'A incoerência entre rótulo, partido e propostas custou credibilidade.':'Seu programa era coerente com o partido e com o rótulo assumido.');
  if(p.flags.irreal)fat.push('O custo alto das promessas afastou mercado e classe média e virou munição nos debates.');
  if(p.rej>10)fat.push('Ataques, polêmicas e posições extremas elevaram sua rejeição, o que pesa muito num 2º turno.');
  const ds=p.debScore.reduce((a,b)=>a+b,0);fat.push(p.debScore.length?`Nos debates, seu saldo foi ${ds>=2?'positivo':ds>=0?'neutro':'negativo'}.`:'Você não foi a debates: evitou riscos, mas perdeu vitrines.');
  fat.push(`Seu melhor desempenho foi entre ${low(best.s)} e o pior entre ${low(worst.s)}.`);
  const res=f.others?f.others.v:f.res;
  const titulo=f.win?`${esc(p.nome)}, presidente eleit${p.g}`:(f.place?'Fora do segundo turno':`Derrota${f.turno===2?' no segundo turno':''}`);
  render(`
  <div class="cover">${victoryScene(f.win)}</div>
  <div style="padding:10px 0">
    <h1>${titulo}</h1>
    <p style="font-size:1.1rem">${f.win?'Agora vem a parte difícil: governar com um Congresso fragmentado e cumprir o que prometeu.':f.place?`${esc(nameOf(f.others.w))} venceu o 2º turno contra ${esc(nameOf(f.others.w===f.others.a?f.others.b:f.others.a))}.`:'O eleitor escolheu outro projeto. Veja o que pesou.'}</p>
  </div>
  <div class="urna" aria-hidden="true">
    <div class="tela"><div class="small">Seu voto para</div><div style="font-weight:800;margin:4px 0 10px">Presidente</div>
      <div>Número: <span class="dig">${esc(p.num[0])}</span><span class="dig">${esc(p.num[1])}</span></div>
      <div style="margin-top:10px">Nome: <b>${esc(p.nome.toUpperCase())}</b><br>Partido: ${PARTIES[p.party].sig}<br>Vice: ${VICES[p.vice].n}</div>
      <div class="small" style="margin-top:10px;border-top:1px solid currentColor;padding-top:6px">${f.win?'Fim: eleit'+p.g:'Resultado: '+fmt(f.res.eu||0)+'% dos válidos'}</div></div>
    <div class="teclado">${[1,2,3,4,5,6,7,8,9,'',0,''].map(k=>k===''?'<span></span>':`<span class="k">${k}</span>`).join('')}
      <div class="kb"><span style="background:#fff;color:#222">BRANCO</span><span style="background:#e46a1b;color:#fff">CORRIGE</span><span style="background:#138a45;color:#fff">CONFIRMA</span></div></div>
  </div>
  <div class="panel"><h3>Resultado final</h3><div class="poll">${ranking(res).map((id,ix)=>`<div class="ln"><span class="nm"><span class="hd" style="border-color:${colorOf(id)}">${headOf(id,30,ix===0?'happy':'sad')}</span>${esc(nameOf(id))}</span><div class="bar" aria-hidden="true"><i style="width:${res[id]}%;background:${colorOf(id)}"></i></div><span class="val">${fmt(res[id])}%</span></div>`).join('')}</div>
  ${S.r1&&f.turno===2?`<p class="small muted">No 1º turno você teve ${fmt(S.r1.valid.eu)}%.</p>`:''}</div>
  <div class="panel"><h3>O que decidiu sua campanha</h3>${fat.map(x=>`<div class="news">${x}</div>`).join('')}
    <details style="margin-top:10px"><summary>Linha do tempo das suas decisões</summary>${S.log.map(x=>`<div class="news small">${esc(x)}</div>`).join('')}</details></div>
  <div class="panel"><h3>Seu perfil no mapa político</h3>${axisChart()}</div>
  <div class="panel"><h3>Votos por grupo do eleitorado</h3><div class="seglist">${segs.map(([s,v])=>`<div class="ln"><span>${ico(s.id)} ${s.s}</span><div class="bar" aria-hidden="true"><i style="width:${v*100}%;background:var(--ink)"></i></div><span>${Math.round(v*100)}%</span></div>`).join('')}</div></div>
  <div class="panel"><h3>Afinidade com os adversários</h3><p class="small muted">Quanto suas posições se parecem com as de cada candidatura.</p>
    <div class="seglist">${affin.map(([o,v])=>`<div class="ln"><span style="display:flex;align-items:center;gap:6px"><span class="hd" style="border-color:${o.cor}">${headOf(o.id,28,'neutral')}</span>${o.nome}</span><div class="bar" aria-hidden="true"><i style="width:${v}%;background:${o.cor}"></i></div><span>${Math.round(v)}%</span></div>`).join('')}</div></div>
  <div class="panel"><h3>Para refletir</h3>
    <p>Em <b>${match} de ${THEMES.length}</b> temas você escolheu a posição mais próxima da média do eleitorado neste modelo. Isso mede proximidade com a média, não acerto. ${match>=9?'Você jogou perto do centro: menos rejeição, mas também menos paixão. Seu programa tinha uma identidade clara?':match<=4?'Você nadou contra a corrente em boa parte dos temas. Convicção pode mobilizar uma base fiel, mas exige convencer quem pensa diferente.':'Você combinou temas populares com apostas próprias.'}</p>
    <div class="news">Suas escolhas refletiram o que você acredita ou o que você achou que daria voto?</div>
    <div class="news">Em qual tema você ficou mais em dúvida? Os argumentos do outro lado tinham algum ponto que você não tinha considerado?</div>
    <div class="news">Um candidato que muda de posição para ganhar votos está ouvindo o eleitor ou sendo oportunista?</div>
    <div class="news">${f.win?'Você conseguiria cumprir as promessas com o custo fiscal que assumiu e o Congresso que tende a sair de uma eleição como essa?':'Que concessão você não faria, mesmo que custasse a eleição?'}</div>
  </div>
  <div class="panel"><h3>Um aviso sobre este modelo</h3>
    <p>A matemática do jogo tende a favorecer candidaturas coerentes e próximas do centro, porque elas ficam a uma distância razoável de muitos grupos ao mesmo tempo. Eleições reais nem sempre funcionam assim: mobilização, identidade, lealdade e paixão das bases pesam muito, e o Brasil elegeu presidentes de perfis bem diferentes nas últimas décadas. Ficar no meio não é sinônimo de estar certo, e convicção não é sinônimo de radicalismo.</p>
    <p class="small muted">Candidatos, partidos e pesos são fictícios e simplificados; não reproduzem pesquisas reais. Os temas foram escolhidos a partir de debates recorrentes na política brasileira e de ferramentas de afinidade como o Ranking dos Políticos. Para conhecer candidatos reais, compare os planos de governo registrados no TSE (DivulgaCandContas), o histórico de votações no Congresso e ferramentas de afinidade de diferentes organizações, já que cada uma usa critérios próprios.</p>
  </div>
  <div class="row"><button class="btn" onclick="clearSave();fresh();go('intro')">Jogar novamente</button><button class="btn alt" onclick="replaySame()">Nova campanha com a mesma chapa</button></div>`,keep);
};
function replaySame(){
  const keep=JSON.parse(JSON.stringify({av:S.p.av,nome:S.p.nome,g:S.p.g,num:S.p.num,slogan:S.p.slogan,label:S.p.label,party:S.p.party,vice:S.p.vice,mkt:S.p.mkt,deb:S.p.deb,ans:S.p.ans,prios:S.p.prios}));
  const q=S.quick,pr=S.preset;clearSave();fresh();Object.assign(S.p,keep);S.quick=q;S.preset=pr||'custom';S.qi=0;go(q?'perfil':'temas');
}

SAVED=loadSave();
go('intro');
</script>
</body>
</html>
